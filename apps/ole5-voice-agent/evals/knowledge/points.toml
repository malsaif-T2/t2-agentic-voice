# Every chunk of Ole5's knowledge base, as the prototype's export lists them (its
# kb_export/ole5/, read only: D-010), with no text: each document by its name and the key its
# points' IDs start with, then each chunk by its ID in the export, in order. A point's ID is
# its document's key and its chunk's number. The export kept only the chunks of 10 words or
# more, so a document may start after `chunk_001`, and it gave no page (Markdown documents).
# Every `expected` ID of the knowledge set's items is one of these
# (ole5_voice/evals/knowledge_set.py).

