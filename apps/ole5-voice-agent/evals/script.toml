# Ticket numbers read out, for ID recall: two of the last four digits, which the prototype's
# agent read out, and two of a full number, in the shape the owner gave (Q5): 16 digits, the date
# as YYYYMMDD, then 82, then a 6-digit counter. Every number here is made up. The full ones are
# dated after 2026-11-01, the day the owner gave the shape, so neither is one of the owner's
# examples, which may be real tickets. Their months and days have two digits, so only the
# counter starts with zeros. A reading in groups may drop them while the reference keeps each
# one, so the cue says how to read the number and asks for every zero.

[[lines]]
id = "n44_ticket_last_four"
kind = "ticket_number"
language = "saudi"
say = ["التذكرة اللي آخرها 4821"]

[[lines]]
id = "n45_ticket_full_saudi"
kind = "ticket_number"
language = "saudi"
say = ["رقم التذكرة 2026111782000917"]
cue = "Read the number in Saudi Arabic, as a customer reads one from an email: digit by digit or in groups, whichever comes naturally, but say every zero of the counter (000917 is zero, zero, zero, then 917, never 917 alone). If a zero is left out, record the take again, or type what was said in review."

[[lines]]
