# The script of the owner's new recordings (plan 002's registration, "New recordings (N)"), read
# by `poe record` and by the recordings import (`takes.load_script`).
#
# DRAFT: the agent's proposal, which the owner approves or changes before recording: the lines,
# their kinds and counts, and their dialect labels (Q4); the ticket numbers' shape (Q5); and the
# independent check of each recording (Q9). Nothing here is recorded until then. Ticket-number
# and echo-only items are the agent's additions (evaluation.md measures ticket-number recall and
# text from the agent's own echo); over-the-agent items on the two headsets are not proposed
# here, and are the owner's call (Q4).
#
# Each line is said once on each of three devices: the laptop's speakers and microphone, a wired
# headset, a Bluetooth headset. `say` holds the clauses, in order: a line of several pauses
# between them, where the owner then marks the true turn end. A line with no `say` holds no
# speech: `cue` says what to do, `seconds` how long, `reply` which agent reply plays meanwhile
# (its ID in the lab's replies.json). References follow the spelling guide (spelling.toml):
# product terms in Latin script, numbers as digits, contractions as said, and listening sounds
# from the list below.
#
# The proposal's counts, by kind (Saudi, MSA, English, mixed): requests of one clause 6, 4, 4,
# 4; requests of several clauses that pause 4, 2, 2, 2; stop words 3, 1, 2; repeat requests 2,
# 1, 1; listening sounds 3 Saudi and 2 English; ticket numbers 2, 1, 1; silence or a noise 3;
# the agent's echo only 2. That is 52 lines, 156 recordings; strata.toml holds the counts.

# The fixed list of listening sounds, as references spell them (the spelling guide, Q8): the
# talk-over's ten, and two English ones the agent adds.
listening_sounds = ["اها", "امم", "ايوه", "ايه", "تمام", "تمام تمام", "طيب", "كمل", "mm-hmm", "okay", "uh-huh", "yeah"]

