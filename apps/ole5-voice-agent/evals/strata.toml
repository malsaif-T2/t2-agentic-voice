# and the items of the script the owner approved on 2026-11-01 (Q4), whose lines the [script]
# tables count, with every take the owner kept on the three devices. Variants are counted
# by the device of their microphone and by their tags: the talk-over's condition (duck, pause),
# whether the take began over the assistant, and its playback device.

