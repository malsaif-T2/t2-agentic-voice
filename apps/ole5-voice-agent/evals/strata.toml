# The golden set's registered counts per stratum (plan 002's registration, "Strata";
# evaluation.md, "Writing items": strata in fixed proportions, which a test enforces). `poe
# golden` and tests/ole5_voice/evals/test_strata.py fail when the committed items, their
# variants or the script's lines do not hold these counts. A count changes only with the set it
# counts, in the same commit, reviewed like the items.
#
# The set holds the talk-over items, with the languages `import_talkover.py` gives them (Q7),
# and the items of the script the owner approved on 2026-11-01 (Q4), whose lines the [script]
# tables count, with every take the owner kept on the three devices. Variants are counted
# by the device of their microphone and by their tags: the talk-over's condition (duck, pause),
# whether the take began over the assistant, and its playback device. The [script] tables also
# count M3's 41 lines (plan 005, Q2 and Q6), whose items hold every take the owner kept on the
# laptop and the wired headset on 2026-11-04 (its Bluetooth session left out, at the owner's
# word: "lets skip Bluetooth").

