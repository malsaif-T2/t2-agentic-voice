[project]
name = "ole5-voice-agent"
version = "0.1.0"
description = "The Ole5 Voice Agent: a voice-first support assistant for Ole5, built on T2 Agentic Voice."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "t2-agentic-voice",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
t2-agentic-voice = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ole5_voice"
