# The flight agent's scripted calls (flight_voice/evals/scenarios.py): a Saudi caller asks
# for business to Paris, then changes it to economy before picking the return.
id = "f06_cabin_change_saudi"
split = "dev"
language = "ar-SA"
kind = "trip_change"
notes = "Business first, then economy: change_trip re-prices the chosen outbound, the return is listed in economy, and the read-back holds economy."

[[turns]]
says = "أبي أروح باريس على البزنس يوم عشرين ديسمبر وأرجع بعد أسبوع"
calls = ["search_flights"]
args = { destination = "CDG", depart = "2026-12-20", return_date = "2026-12-27", cabin = "business" }
forms = { depart = { kind = "on", day = 20, month = 12 }, return_date = { kind = "nights", nights = 7 } }

[[turns]]
says = "حقت الصبح"
calls = ["choose_flight"]
args = { leg = "outbound", pick = "part_of_day", part = "morning" }

[[turns]]
says = "لا خلها سياحي"
calls = ["change_trip"]
args = { cabin = "economy" }

[[turns]]
says = "الأولى"
calls = ["choose_flight", "book_trip"]
args = { leg = "return", pick = "number", n = 1 }
outcome = "read_back"
read_back = { outbound = "T2 453@2026-12-20", return = "T2 452@2026-12-27", one_way = false, travelers = 1, cabin = "economy" }

[[turns]]
says = "إي احجزها"
when = "closing_question"
outcome = "done"
