# The flight agent's scripted calls (flight_voice/evals/scenarios.py): a bare yes over the
# closing question, once the summary has played whole, books (the owner's ruling of
# 2026-11-17: any yes books).
id = "f22_bare_yes_closing_saudi"
split = "dev"
language = "ar-SA"
kind = "confirmation"
notes = "A bare yes over the closing question, the summary played whole, books the Mumbai trip (the owner's ruling of 2026-11-17, any yes books; it was asked again before)."

[[turns]]
says = "أبي أروح مومباي يوم عشرة ديسمبر، رايح بس"
calls = ["search_flights"]
args = { destination = "BOM", depart = "2026-12-10", one_way = true }
forms = { depart = { kind = "on", day = 10, month = 12 } }

[[turns]]
says = "الثانية"
calls = ["choose_flight", "book_trip"]
args = { leg = "outbound", pick = "number", n = 2 }
outcome = "read_back"
read_back = { outbound = "T2 503@2026-12-10", one_way = true, travelers = 1, cabin = "economy" }

[[turns]]
says = "إي"
when = "closing_question"
outcome = "done"
