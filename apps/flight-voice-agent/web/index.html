<!doctype html>
<!-- The flight agent's page, served by its server (flight_voice/server.py) with the library's
     page headers: no inline script or style. Every text is set by app.js with textContent, in
     the language the caller picks (Arabic first, the page then rtl). The call is the product: the
     orb in the middle, one round button to start or end it, the lines the caller could say as
     text, never buttons, and the cards below only mirror what the agent said. What belongs to a
     traveler and their bookings (the trips, "Start over", the name and tier) starts hidden and is
     shown only when the profile says the line books (app.js). -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title data-text="title"></title>
<link rel="icon" href="mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar glass">
  <p class="brand"><img src="mark.svg" alt="" width="28" height="28"> <span id="brand" dir="auto"></span></p>
  <p id="traveler" class="traveler" dir="auto" hidden></p>
  <button type="button" id="trips-toggle" class="quiet" aria-expanded="false" aria-controls="trips" data-text="trips" hidden></button>
  <button type="button" id="start-over" class="quiet" data-text="startOver" hidden></button>
  <nav class="languages" aria-label="Language">
    <button type="button" class="language" data-language="ar-SA" lang="ar" aria-pressed="true">العربية</button>
    <button type="button" class="language" data-language="en" lang="en" aria-pressed="false">English</button>
  </nav>
</header>

<section id="reset-ask" class="ask glass" role="alertdialog" aria-labelledby="reset-question" hidden>
  <p id="reset-question" data-text="askReset"></p>
  <p class="controls">
    <button type="button" id="reset-yes" class="primary" data-text="resetYes"></button>
    <button type="button" id="reset-no" data-text="resetNo"></button>
  </p>
</section>

<main class="layout">
  <section id="call" class="call">
    <div class="hero glass">
      <h1 id="heading" dir="auto"></h1>
      <p id="assistant" class="assistant" dir="auto"></p>
      <div class="stage">
        <div id="orb" class="orb" data-state="" aria-hidden="true">
          <span class="orb-glow"></span>
          <span class="orb-ring"></span>
          <span class="orb-core"></span>
        </div>
      </div>
      <p id="state" class="state" role="status" aria-live="polite"></p>
      <p class="actions">
        <button type="button" id="start" class="call-button primary" data-text="start"></button>
        <button type="button" id="end" class="call-button end" data-text="end" disabled hidden></button>
      </p>
      <p id="message" class="message" role="alert"></p>
      <section class="could-say" aria-labelledby="could-say-title">
        <h2 id="could-say-title" data-text="youCouldSay"></h2>
        <ul id="lines" class="lines"></ul>
      </section>
    </div>

    <section id="cards-section" class="cards" aria-labelledby="cards-title" hidden>
      <h2 id="cards-title" data-text="cardsTitle"></h2>
      <ol id="cards" class="card-list"></ol>
    </section>

    <details class="fold glass">
      <summary data-text="conversation"></summary>
      <ol id="captions" class="captions" aria-live="polite"></ol>
    </details>
    <details id="options" class="fold glass">
      <summary data-text="options"></summary>
      <p><label class="field"><span data-text="code"></span>
        <input type="password" id="code" autocomplete="off" spellcheck="false" dir="ltr"></label></p>
      <p><label class="box"><input type="checkbox" id="record"> <span data-text="record"></span></label></p>
      <p class="controls">
        <label class="box"><input type="checkbox" id="push-to-talk"> <span data-text="pushToTalk"></span></label>
        <button type="button" id="talk" data-text="talk" aria-pressed="false" disabled></button>
      </p>
    </details>
  </section>

  <aside id="trips" class="trips glass" aria-labelledby="trips-title" hidden>
    <h2 id="trips-title" data-text="trips"></h2>
    <p><label class="field"><span data-text="filter"></span>
      <input type="search" id="trips-filter" inputmode="numeric" autocomplete="off" dir="ltr"></label></p>
    <ul id="trips-list" class="trip-list"></ul>
    <p id="trips-note" class="muted" role="status"></p>
  </aside>
</main>
</body>
</html>
