# The workspace root of T2 Agentic Voice: the library (packages/t2-agentic-voice), the Ole5
# Voice Agent built on it (apps/ole5-voice-agent), and the examples (examples/). The root is not
# a package itself: it holds the members, the shared dev tools, and the one gate for all of them.
[project]
name = "t2-agentic-voice-workspace"
version = "0.1.0"
description = "T2 Agentic Voice: a library for speech-first voice agents, the Ole5 Voice Agent built on it, and examples."
requires-python = ">=3.12"
dependencies = [
    "t2-agentic-voice",
    "ole5-voice-agent",
    "t2-agentic-voice-minimal-example",
]

[tool.uv]
# `uv sync` installs every member, editable, and builds nothing for the root.
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*", "examples/*"]

[tool.uv.sources]
t2-agentic-voice = { workspace = true }
ole5-voice-agent = { workspace = true }
t2-agentic-voice-minimal-example = { workspace = true }

[dependency-groups]
dev = [
    "aiortc>=1.15.0",
    "coverage>=7.17.0",
    "mypy>=2.3.1",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

# --------------------------------------------------------------------------- tasks
# `uv run poe` lists tasks. `uv run poe check` is the definition-of-done gate. The harness's own
# settings (layers, owned libraries, required docs, size caps, the coverage floor) are in
# harness.toml, which the checks read.

[tool.poe.env]
# Every task writes UTF-8, so non-ASCII text reads the same in a console, a pipe, or a file.
# Piped, Python otherwise writes in the legacy code page on Windows
# (tests/harness/test_commands.py).
PYTHONIOENCODING = "utf-8"

[tool.poe.tasks.fmt]
help = "Auto-format and apply safe lint fixes (run this first when `lint` fails)"
sequence = [{ cmd = "ruff format ." }, { cmd = "ruff check --fix ." }]

[tool.poe.tasks.lint]
help = "Check formatting and lint rules"
sequence = [{ cmd = "ruff format --check ." }, { cmd = "ruff check ." }]
ignore_fail = "return_non_zero"

[tool.poe.tasks.types]
help = "Static type check (mypy strict) of the members, scripts/, and tests/"
cmd = "mypy packages/t2-agentic-voice/src apps/ole5-voice-agent/src examples/minimal/src scripts tests"

[tool.poe.tasks.arch]
help = "Enforce the layers and module rules of harness.toml (a FIX line for every violation)"
cmd = "python -m scripts.check_architecture"

[tool.poe.tasks.docs]
help = "Verify the knowledge base: required docs, links, orphans, placeholders, line endings, plans, registers, references"
cmd = "python -m scripts.check_docs"

[tool.poe.tasks.test]
help = "Run the tests with line coverage, failing under the floor in harness.toml"
cmd = "pytest --cov --cov-config=harness.toml"

[tool.poe.tasks.check]
help = "Definition-of-done gate: lint, types, arch, docs, test (runs all, fails if any fail)"
sequence = ["lint", "types", "arch", "docs", "test"]
ignore_fail = "return_non_zero"

[tool.poe.tasks.gc]
help = "Whether a garbage-collection round is due, then its candidates (not a gate)"
sequence = [{ cmd = "python -m scripts.gc_due" }, { cmd = "python -m scripts.gc_report" }]

[tool.poe.tasks.quality]
help = "Grade each layer after `poe check` (not a gate); grades and gaps go in docs/harness/quality.md"
cmd = "python -m scripts.quality"

[tool.poe.tasks.settings-ref]
help = "Write docs/generated/settings.md and .env.example from the library's settings model"
cmd = "python -m scripts.settings_ref"

# The golden set's commands (plan 002; evaluation.md): each runs a module of the Ole5 app's
# evaluation package, and passes on the arguments given after the task's name.

[tool.poe.tasks.golden]
help = "Validate the golden set and freeze its expected answers (`--audio <root>=<folder>` also checks the audio)"
cmd = "python -m ole5_voice.evals.golden"

[tool.poe.tasks.eval]
help = "Run an answerer over the golden set into a new folder, every setting and path on its command line"
cmd = "python -m ole5_voice.evals.run"

[tool.poe.tasks.eval-compare]
help = "Compare two runs variant by variant: fixed, broken, net, and the sign test by item"
cmd = "python -m ole5_voice.evals.compare"

[tool.poe.tasks.eval-history]
help = "Render the golden set's run history into docs/generated/eval-history.md"
cmd = "python -m ole5_voice.evals.history"

[tool.poe.tasks.eot]
help = "Measure where the turns end on the golden set's paused requests, offline and with no spend (`--answerer reference` or `pipeline`)"
cmd = "python -m ole5_voice.evals.eot"

[tool.poe.tasks.eval-timing]
help = "Time each step of an echo call on the golden set's dev paused requests (spends: model, timeout, prices and cap on its command line)"
cmd = "python -m ole5_voice.evals.timing"

[tool.poe.tasks.record]
help = "Record and review the golden set's new takes in Chrome, on a page served on 127.0.0.1"
cmd = "python -m ole5_voice.evals.recorder"

# --------------------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# LF everywhere, as .gitattributes stores it: `poe lint` flags a CRLF working copy (a Windows
# editor or script), and `poe fmt` fixes it.
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "N", "PTH", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use made-up secrets, and run this interpreter as a subprocess. They also hold
# Arabic text and digits as written (RUF001 to RUF003 flag Arabic letters and digits as
# confusable with Latin ones); the library writes its tables with `\u` escapes instead, each
# character named in a comment.
"tests/**" = ["S101", "S105", "S106", "S603", "RUF001", "RUF002", "RUF003"]
# ast.NodeVisitor requires visit_CamelCase method names.
"scripts/**" = ["N802"]

# --------------------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
# Each member's src/ holds its package; scripts/ and tests/ are importable from the repository
# root. tests/ has no __init__.py files (pytest's importlib mode), so module names come from
# these bases.
mypy_path = ["packages/t2-agentic-voice/src", "apps/ole5-voice-agent/src", "examples/minimal/src"]
explicit_package_bases = true

# num2words 0.5.14 ships no types (no py.typed in its wheel: plan 003, step 3); pipecat-ai,
# loguru and PyJWT do.
[[tool.mypy.overrides]]
module = ["num2words", "num2words.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
# Coverage's settings (what is measured, and the floor) are in harness.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# A test still running after this many seconds prints every thread's stack, so a hang shows
# where it waits (the recorder's, plan 004's close, TD-040).
faulthandler_timeout = 120
# An exception escaping a thread or a finalizer is a bug, never only a warning. Pipecat 1.15.0's
# `pipecat/audio/utils.py` imports the standard library's `audioop`, which Python 3.12 marks
# deprecated (3.13 removes it, and the lock brings `audioop-lts` there): a test that imports
# Pipecat can do nothing about it.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "ignore:'audioop' is deprecated:DeprecationWarning:pipecat.audio.utils",
]
# Tests that need something outside the repository declare a marker here and skip themselves
# when it is absent, so CI and a fresh clone stay green.
markers = [
    "integration: needs an external service; skipped when it is not running",
]
