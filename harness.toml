# The harness's settings. Every check in scripts/ reads this file (scripts/harness_config.py),
# so a project changes its rules here, never in the check code. Each key is required; a key the
# loader does not know, or a value of the wrong kind, is a HARNESS-CONFIG violation.
#
# Changing [layers], [[owners]], [[restricted]], or [[subpackages]] changes the architecture:
# update ARCHITECTURE.md in the same commit (ARCH-DOC fails until its layer table matches
# [layers] and [[owners]]) and record why in docs/design/decisions.md (review: no check reads it).

[package]
# The library's import package, at <root>/<name>/ (D-013).
name = "t2_agentic_voice"
root = "packages/t2-agentic-voice/src"
# Its public API: the modules an app may import (ARCH-PUBLIC). The package root and the facades
# below re-export the names apps use; a public subpackage (such as a future "<name>.testing")
# makes its modules public too. Everything else is internal, free to change without a major
# version.
public = [
    "t2_agentic_voice",
    "t2_agentic_voice.ports",
    "t2_agentic_voice.groq",
    "t2_agentic_voice.languages",
    "t2_agentic_voice.evals",
    "t2_agentic_voice.tracing",
]
# The public modules that sit directly under the package root as thin facades, beside its
# __init__.py (the design's 5.3; D-021): each is also in `public`, and holds only a docstring,
# imports and `__all__` (ARCH-FACADE). Like the package root, a facade may import every layer,
# while ARCH-OWNER still applies to it.
facades = [
    "t2_agentic_voice.ports",
    "t2_agentic_voice.groq",
    "t2_agentic_voice.languages",
    "t2_agentic_voice.evals",
    "t2_agentic_voice.tracing",
]
# Words the library's src/ never holds, in any case: the names of the apps built on it and of
# their own services, so the library stays free of any one app (ARCH-WORDS). Read in the path
# below [package] root of every file, and in the text of its source and text files, never in
# __pycache__/.
banned_words = ["ole5", "otrs", "ds.t2.sa"]

# Each layer of the package (a folder directly under src/<name>/) and the other layers it may
# import. A layer always may import itself. The graph may not have a cycle. Code must sit inside
# a layer: a module directly in src/<name>/ (other than __init__.py and the [package] facades)
# is a violation.
# The layers of a voice support call (D-003, ARCHITECTURE.md): rules without IO at the bottom,
# the outside services beside the backend, the real-time pipeline above the talker, and the
# HTTP surface on top as the composition root. The testing kit sits beside the HTTP surface: it
# may import the pipeline and everything below it, but never a provider's adapter (D-019).
[layers]
core = []
domain = ["core"]
adapters = ["core", "domain"]
actions = ["core", "domain"]
agent = ["core", "domain", "actions"]
voice = ["core", "domain", "agent"]
testing = ["core", "domain", "actions", "agent", "voice"]
api = ["core", "domain", "adapters", "actions", "agent", "voice", "testing"]

# Libraries that only some layers may import (ARCH-OWNER), one table per group. The fix text is
# printed with every violation, so it says what to do instead.
[[owners]]
modules = ["logging", "structlog"]
layers = ["core"]
fix = "Log via `from t2_agentic_voice.core.logging import get_logger`; `log = get_logger(__name__)`; `log.info('event_name', key=value)`."

[[owners]]
modules = ["pydantic_settings"]
layers = ["core"]
fix = "Add a field, with its description, to VoiceSettings or its group in core/settings/ and run `uv run poe settings-ref`; load the settings with `VoiceSettings.from_env()` or take an injected VoiceSettings."

[[owners]]
modules = ["opentelemetry", "openinference", "phoenix"]
layers = ["core"]
fix = "Trace through core's tracing helpers (one span per step, Phoenix behind them); never import the tracing libraries elsewhere."

[[owners]]
modules = ["requests"]
layers = ["core"]
fix = "Only core's tracing uses requests, as the OTLP exporter's session; reach an outside service through its port in domain/ports."

[[owners]]
modules = ["groq", "httpx", "qdrant_client"]
layers = ["adapters"]
fix = "Reach an outside service through its port in domain/ports; the adapter that implements it lives in adapters/ and the api layer injects it."

[[owners]]
modules = ["pipecat"]
layers = ["voice"]
fix = "Keep the voice framework inside voice/; other layers take plain text, audio bytes, or domain models from it."

[[owners]]
modules = ["fastapi", "starlette", "uvicorn"]
layers = ["api"]
fix = "HTTP lives in api/; a lower layer returns a typed model or raises a T2VoiceError, and api maps it to a response."

[[owners]]
modules = ["jiwer"]
layers = ["testing"]
fix = "Score through the evaluation helpers in testing/scorers.py (`wer`, `cer`, re-exported by the `evals` facade); never import jiwer elsewhere."

# Classes that only some layers may construct (ARCH-CONSTRUCT): calls, `.model_validate`, and
# `.model_construct` all count. Use it for an object that only a validator may issue. Example:
#
# [[restricted]]
# classes = ["ApprovedPayment"]
# layers = ["domain"]
# fix = "Only domain/approval.py issues an ApprovedPayment; call approve() instead of building one."
#
# Planned here, in the commit that creates each class (docs/SECURITY.md, invariants 1 and 2): a
# confirmed ticket draft, issued only by domain's yes rule; its two inputs, the caller's heard
# words and the read-back receipt, built only by voice; and a completed action, recorded only by
# actions.

# Packages built on the library, as a teammate's app would be (ARCH-PUBLIC, D-013): each imports
# the library only through [package] public and no other app, and the library never imports
# one. The module rules (size, fmt: skip, parse) apply to them too; the layer and owner rules do
# not, since an app has no layers of its own.
[[apps]]
name = "ole5_voice"
root = "apps/ole5-voice-agent/src"

[[apps]]
name = "minimal_example"
root = "examples/minimal/src"

# Narrower import rules for a subpackage inside a layer (ARCH-LAYER). Example:
#
# [[subpackages]]
# path = "voice/transport"
# may_not_import = ["agent"]
# fix = "The transport only moves audio; the pipeline module wires it to the talker."

[rules]
# The only modules (relative to the package folder) that read the environment (ARCH-ENV).
env_allowed_files = ["core/config.py"]
# Modules that may write to standard output directly (ARCH-PRINT); all others log.
output_allowed_files = ["core/logging.py"]
# The doc that describes the layers: its layer table must match [layers] and [[owners]], row by
# row (ARCH-DOC, scripts/arch_doc.py). "" turns it off.
architecture_doc = "ARCHITECTURE.md"

[modules]
# ARCH-SIZE, for every module of the library, the apps, and the support folders.
max_lines = 400
# Folders outside the layers: only the module rules (size, fmt: skip, parse) apply there.
support_dirs = ["scripts", "tests"]

[docs]
# The agent's entry point: a map, not a manual (DOC-ENTRY). Every doc under docs/ must be
# reachable from it by following links (DOC-ORPHAN).
entry = "CLAUDE.md"
max_entry_lines = 120
# Docs that must exist (DOC-REQUIRED).
required = [
    "CLAUDE.md",
    "ARCHITECTURE.md",
    "docs/harness/PRINCIPLES.md",
    "docs/harness/golden-principles.md",
    "docs/harness/garbage-collection.md",
    "docs/harness/quality.md",
    "docs/plans/README.md",
    "docs/plans/roadmap.md",
    "docs/plans/tech-debt.md",
    "docs/design/decisions.md",
    "docs/SECURITY.md",
    "docs/project/DESCRIPTION.md",
]
# History keeps the milestone numbers of its time, and may cite retired debt and principles.
# The run history is generated from records that are never edited, so it is history too.
historical = [
    "docs/plans/completed/",
    "docs/design/decisions.md",
    "docs/generated/eval-history.md",
]
# Code that may not cite milestones, and whose citations must exist (DOC-MILESTONE, DOC-REF).
code_dirs = ["packages", "apps", "examples", "scripts", "tests"]
# Code exempt from those two rules: the harness tests whose fixtures cite made-up entries.
code_exempt = [
    "tests/harness/test_check_docs.py",
    "tests/harness/test_doc_refs.py",
    "tests/harness/test_gc_due.py",
]
# Files (or folders, ending in /) that may keep install placeholders on purpose: an uppercase
# name between double braces (DOC-PLACEHOLDER).
placeholders_allowed_in = []

[plans]
roadmap = "docs/plans/roadmap.md"
active = "docs/plans/active"
completed = "docs/plans/completed"
# The headings every plan must have, each on its own line (DOC-PLAN).
sections = ["## Goal", "## Acceptance criteria", "## Plan", "## Progress log", "## Decision log"]

# Where each kind of citation is recorded (DOC-REF). A registry whose doc is missing is skipped;
# "" turns one off. Plans (`plan NNN`) are the files in [plans] active and completed.
[references]
decisions = "docs/design/decisions.md"
tech_debt = "docs/plans/tech-debt.md"
golden_principles = "docs/harness/golden-principles.md"
invariants = "docs/SECURITY.md"

# `uv run poe gc`: whether a garbage-collection round is due, and its candidates. Not a gate.
# Calibrated by the first round against what its read found to be noise (plan 004, decision log).
[gc]
# Commits, merges left out, that make a round due.
due_after_commits = 40
# The shortest repeated token run reported (and counted by `poe quality`): this code's real
# copies run 25 to 34 tokens.
min_tokens = 25
# Modules above this many lines are listed: 100 lines under [modules] max_lines is about one
# large change (plan 004 measured the growth per commit).
size_watch = 300
# Where a path named in a doc or a comment may be relative to (the library's and each app's
# package folder are always added): the root, the docs' folders, and the app's member folder,
# whose data folder (`evals/`) docs and code name.
path_bases = ["", "docs", "docs/design", "docs/plans", "apps/ole5-voice-agent"]
# Path prefixes that are not ours to resolve: runtime output, the prototype beside the
# repository that code cites as a spec (D-010), and installed libraries' files.
path_ignored = ["var/", "Ole5-chatbot/", "groq/", "httpx/", "requests/", "opentelemetry/"]
# Methods a library calls on our subclasses, so they are never "unreferenced": logging's and
# http.server's handlers (emit; do_GET, do_POST, log_message), OpenTelemetry's span processor
# (on_end).
hooks = ["emit", "do_GET", "do_POST", "log_message", "on_end"]
# Names a doc may cite in backticks that are not in our code: another library's last part, whole
# name, or dotted prefix (`pipecat` for `pipecat.services.x`). ListAgents and SendMessage are
# Claude Code's tools for messaging other sessions (WORKING-RULES.md); the others are Pipecat's,
# the standard library's, OpenTelemetry's, the Groq SDK's, httpx's and requests', FastAPI's, and
# the environment variables those libraries read.
foreign_names = [
    "ListAgents",
    "SendMessage",
    "pipecat",
    "FrameProcessor",
    "LLMService",
    "TTSService",
    "SegmentedSTTService",
    "GroqSTTService",
    "basicConfig",
    "register_at_fork",
    "set_tracer_provider",
    "_handle_fork",
    "_platform",
    "trust_env",
    "include_router",
    "HTTP_PROXY",
    "HTTPS_PROXY",
    "ALL_PROXY",
    "SSL_CERT_FILE",
    "SSL_CERT_DIR",
]
# Non-Python files whose text counts as code when docs cite names (globs from the root): the
# config files, and the apps' own scripts (never a node_modules/ beside them).
name_files = ["pyproject.toml", "harness.toml", ".env.example", "apps/*/src/**/*.js"]
# Docs that describe planned code, so most names and paths they cite do not exist yet: each is
# counted, not listed. The design names the API of the milestones to come.
planned_docs = ["docs/design/package-design.md"]

# `uv run poe quality`: a grade per layer, per app, and for scripts/, after `uv run poe check`.
# Not a gate.
[quality]
doc = "docs/harness/quality.md"
suppressions_floor = 10.0
# The duplicate runs ([gc] min_tokens) that score a unit's duplication zero. At 25 tokens the
# look-alike runs the first round kept would cost a unit a letter at 5 (plan 004).
duplication_floor = 10

[quality.weights]
coverage = 40
size = 20
suppressions = 15
duplication = 15
docstrings = 10

# The coverage floor and what is measured. coverage.py reads these two tables from this file:
# `uv run poe test` runs `pytest --cov --cov-config=harness.toml`. The floor is a ratchet: set it
# a little under what CI measures, and raise it as coverage grows.
[tool.coverage.run]
source = ["t2_agentic_voice", "ole5_voice", "minimal_example", "scripts"]
# Line coverage on Python 3.12's sys.monitoring costs almost nothing; branch coverage falls back
# to the slower tracer.
core = "sysmon"

[tool.coverage.report]
# The scripts are measured for `poe quality`, but the floor is the product packages'.
omit = ["scripts/*"]
fail_under = 90
show_missing = true
skip_covered = true
